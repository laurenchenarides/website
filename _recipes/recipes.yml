  - id: tangzhong-cinnamon-rolls
    category: breads
    title: "Tangzhong Cinnamon Rolls"
    subtitle: "One method, two doughs: classic and pumpkin • 8 large or 12 smaller rolls"
    blurb: "Soft, gooey cinnamon rolls made extra fluffy with a tangzhong. Choose the classic cinnamon dough or a pumpkin spice dough built on a pumpkin tangzhong."
    tags: ["Tangzhong", "2 flavors", "Make-ahead"]
    credit: "Adapted from **Kiley Heard's** [classic](https://www.wellmadebykiley.com/blog/perfect-classic-cinnamon-rolls) and [pumpkin](https://www.wellmadebykiley.com/blog/homemade-pumpkin-cinnamon-rolls) cinnamon rolls · Well Made by Kiley"
    source_url: "https://www.wellmadebykiley.com/blog/perfect-classic-cinnamon-rolls"
    parts:
      - title: "Master Method"
        subtitle: "Shared method for both variants: tangzhong, shaping, baking & frosting"
        meta:
          - ["Oven", "350°F, then 375°F"]
          - ["Pan", "9×13\", buttered"]
          - ["Yield", "8 large or 12 smaller"]
          - ["Total", "~3 hrs + tangzhong cooling"]
        callout:
          label: "Make the tangzhong first"
          text: "Each variant starts with a tangzhong that has to cool to room temperature before it goes into the dough. Make it an hour ahead, or the day before and refrigerate it (let it warm up before using)."
        ingredients:
          - heading: "Before baking (both variants)"
            items:
              - "**½ cup (120ml)** heavy cream, for pouring over the rolls"
          - heading: "Cream cheese frosting (both variants)"
            items:
              - "**8 oz (250g; 1 block)** cream cheese, softened"
              - "**¼ cup (58g)** salted butter, softened"
              - "**1¾ cups (210g)** powdered sugar"
              - "**1 tsp (4g)** vanilla bean paste or extract"
        steps:
          - heading: "Universal shape, bake & frost protocol"
            items:
              - "**Make the dough:** Follow the Classic or Pumpkin tab through the first rise and the filling."
              - "**Roll out:** Butter a 9×13\" pan. On a lightly floured surface, roll the dough to **16×15\"** for 8 large rolls or **24×15\"** for 12 smaller rolls."
              - "**Fill:** Spread the filling evenly over the dough, leaving a very thin border."
              - "**Shape:** Cut along the long side into 2\"-wide strips. Roll each strip up from the short end into a tight coil and tuck the tail underneath. (Or roll the whole sheet into a log and slice 2\" rolls with a sharp knife or unflavored floss.)"
              - "**Proof:** Arrange in the pan, cover, and proof 25–30 minutes until puffy while the oven heats to 350°F."
              - "**Cream:** Warm the cream about 15 seconds in the microwave and pour it all over the rolls."
              - "**Bake:** Bake at 350°F (22–24 minutes for 8 large rolls, 20–22 minutes for 12 smaller), then raise the oven to 375°F and bake 5–7 minutes more, until golden and cooked through."
              - "**Frost:** While they bake, beat the cream cheese and butter until fluffy, then beat in the powdered sugar and vanilla. Rest the rolls 10–15 minutes, spread on the frosting while they're still warm, and serve."
        notes:
          - label: "What's a tangzhong?"
            text: "A small portion of the recipe's flour cooked with liquid into a thick paste before it goes into the dough. Cooking lets the flour's starch absorb far more liquid than it could cold, and it holds onto that moisture through baking, so the rolls come out softer and fluffier and stay soft longer. The tangzhong's flour and liquid come out of the dough's totals, so the dough feels tackier than usual. Resist adding much extra flour."
          - label: "Don't over-rise"
            text: "The first rise is only 30–45 minutes, and the dough won't double. That's on purpose: a longer rise makes the rolls too airy."
          - label: "Overnight"
            text: "Assemble the rolls in the pan, cover tightly, and refrigerate overnight instead of the second proof. In the morning, let them come to room temperature and proof 45–60 minutes, then add the cream and bake."
          - label: "Storage"
            text: "Covered at room temperature for 1 day (keep frosting in the fridge separately), frosted in the fridge for 3 days, or unfrosted and frozen for up to 2 months. Reheat at 325°F for 10–15 minutes and frost fresh."

      - title: "Classic"
        subtitle: "Classic cinnamon rolls with a milk tangzhong"
        credit: "Adapted from **Kiley Heard's** [Perfect Classic Cinnamon Rolls](https://www.wellmadebykiley.com/blog/perfect-classic-cinnamon-rolls), with the tangzhong from **Bon Appétit's** [Cinnamon Rolls with Cream Cheese Frosting](https://www.bonappetit.com/recipe/cinnamon-rolls-cream-cheese-frosting)"
        callout:
          label: "Still testing"
          text: "The tangzhong uses the milk Kiley blooms the yeast in, so, as in Bon Appétit's recipe, instant yeast is whisked straight into the cooled tangzhong. Expect to adjust the flour by a tablespoon or two."
        ingredients:
          - heading: "Milk tangzhong"
            items:
              - "**¾ cup (180ml)** whole milk"
              - "**¼ cup (31g)** all-purpose flour"
          - heading: "Dough"
            items:
              - "**½ cup (110g)** granulated sugar"
              - "**2½ tsp (9g)** instant yeast"
              - "**½ cup (120g)** Greek yogurt (any %) or sour cream, room temp"
              - "**½ cup (113g)** salted butter, very softened (almost melted)"
              - "**2 eggs**, room temp"
              - "**1 tsp (4g)** vanilla bean paste or extract"
              - "**509g** bread flour (4½ cups minus the tangzhong's ¼ cup)"
              - "**1 tsp (6g)** salt"
          - heading: "Cinnamon filling"
            items:
              - "**½ cup (113g)** salted butter, softened (not melted)"
              - "**1 cup (240g)** light brown sugar"
              - "**2 tbsp (12g)** cinnamon"
              - "**1 tsp (4g)** vanilla bean paste or extract"
        steps:
          - heading: "Tangzhong"
            items:
              - "In a medium saucepan, whisk the milk and flour until smooth. Cook over medium heat, whisking constantly, until thickened and the whisk leaves visible lines on the bottom of the pan, about 2 minutes."
              - "Scrape the tangzhong into the bowl of a stand mixer and let it cool to room temperature."
          - heading: "Dough"
            items:
              - "In a separate bowl, whisk together the flour and salt."
              - "Add the instant yeast, sugar, yogurt, butter, eggs, and vanilla to the tangzhong and whisk to combine. Add the flour mixture and mix with the dough hook on low for 1 minute, until barely combined, then rest 5 minutes."
              - "Mix on medium 5–7 minutes (or knead by hand 5–7 minutes) until smooth, elastic, and pulling away from the bowl. Add flour 1 tbsp at a time only if it won't pull away; keep it slightly tacky."
              - "Cover in a lightly greased bowl and let rise somewhere warm for **30–45 minutes only**."
              - "While the dough rises, mix the filling ingredients until combined."
              - "Continue with the **Master Method**: roll, fill, shape, proof, bake, and frost."
        notes:
          - label: "Side-by-side test: yeast method"
            text: "Still to test. This version follows Bon Appétit and whisks instant yeast straight into the cooled tangzhong, replacing Kiley's step of blooming the yeast in warm milk (her milk now goes into the tangzhong). Bake a batch of Kiley's original alongside this one and compare the rise, crumb, softness, and flavor."

      - title: "Pumpkin"
        subtitle: "Pumpkin spice cinnamon rolls with a pumpkin tangzhong"
        credit: "Adapted from **Kiley Heard's** [Homemade Pumpkin Cinnamon Rolls](https://www.wellmadebykiley.com/blog/homemade-pumpkin-cinnamon-rolls), with the pumpkin tangzhong from **Justine Doiron's** [Pumpkin Tangzhong Cookies](https://justinesnacks.com/pumpkin-tangzhong-cookies/)"
        callout:
          label: "Still testing"
          text: "A portion of pumpkin tangzhong replaces the dough's ½ cup purée and 20g of its flour. Cooking drives off water, so scale the portion to the finished weight: **use 140 × (finished weight ÷ 495) grams** (the raw mix is ~425g pumpkin + 70g flour). For example, 420g finished → about 119g; 450g → about 127g. Record your finished weight and how the dough felt."
        ingredients:
          - heading: "Pumpkin tangzhong (makes extra)"
            items:
              - "**1 (15 oz) can** pumpkin purée"
              - "**½ cup (70g)** all-purpose flour"
          - heading: "Dough"
            items:
              - "**¾ cup (180ml)** milk of choice, warmed to 110°F (warm bath, not hot)"
              - "**½ cup (120g)** brown sugar, light or dark, divided"
              - "**2½ tsp (11g)** active dry yeast (or instant yeast)"
              - "**~140g** pumpkin tangzhong, room temp (in place of ½ cup pumpkin purée; adjust for evaporation, see above)"
              - "**½ cup (113g)** salted butter, very softened (almost melted)"
              - "**1 egg**, room temp"
              - "**1 tsp (4g)** vanilla bean paste or extract"
              - "**520g** bread flour (4½ cups minus about 2½ tbsp)"
              - "**1 tsp (6g)** salt"
              - "**2 tsp (4g)** pumpkin pie spice"
              - "**1½ tsp (3g)** cinnamon"
          - heading: "Pumpkin spice filling"
            items:
              - "**½ cup (113g)** salted butter, softened (not melted)"
              - "**1¼ cups (300g)** light brown sugar"
              - "**¼ cup (60g)** leftover pumpkin tangzhong or plain pumpkin purée"
              - "**1 tbsp (6g)** cinnamon"
              - "**2 tsp (4g)** pumpkin pie spice"
              - "**1 tsp (4g)** vanilla bean paste or extract"
        steps:
          - heading: "Pumpkin tangzhong"
            items:
              - "Add the pumpkin purée and flour to a pot over medium heat and stir into a paste. Cook, stirring constantly, 5–6 minutes, until it's a thick paste (almost like drying glue), starts to film on the bottom of the pot, and turns a shade darker."
              - "**Weigh the finished tangzhong** (weigh the pot empty first, or scrape it all into a tared bowl). Cool completely (the fridge speeds this up), then let it come back to room temperature before using. Leftovers keep in the fridge for up to 2 weeks."
          - heading: "Dough"
            items:
              - "Stir 1 tbsp of the brown sugar into the warm milk and sprinkle the yeast over the top. Let it sit 5–7 minutes, until frothy. (With instant yeast, skip the wait.)"
              - "In a large bowl, whisk together the flour, salt, pumpkin pie spice, and cinnamon."
              - "In a stand mixer bowl, combine the yeast mixture, the rest of the brown sugar, the pumpkin tangzhong, butter, egg, vanilla, and flour mixture. Mix with the dough hook on low for 1 minute, until barely combined, then rest 5 minutes."
              - "Mix on medium 5–7 minutes (or knead by hand 7–9 minutes) until smooth, elastic, and pulling away from the bowl. Add flour 1 tbsp at a time only if it won't pull away; keep it slightly tacky."
              - "Cover in a lightly greased bowl and let rise somewhere warm for **30–45 minutes only**."
              - "While the dough rises, mix the filling ingredients until combined. A little curdling is fine; it melts in the oven."
              - "Continue with the **Master Method**: roll, fill, shape, proof, bake, and frost."

  # ---------------------------------------------------------------------------
  - id: brown-butter-cookie-system
    category: cookies
    title: "High-Altitude Brown Butter Cookie System"
    subtitle: "One master dry base, three variants • Calibrated for 5,000 ft"
    blurb: "Thick, bakery-style brown butter cookies at altitude. Mix one big dry base, then split it into chocolate chip, white chocolate cranberry orange, and caramel variants."
    tags: ["5,000 ft", "Chill overnight", "3 flavors"]
    credit: "Base recipe adapted for altitude from **Kiley Heard** · [Well Made by Kiley](https://www.wellmadebykiley.com/blog/brown-butter-chocolate-chip-cookies)"
    source_url: "https://www.wellmadebykiley.com/blog/brown-butter-chocolate-chip-cookies"
    parts:
      - title: "Master Base"
        subtitle: "Master modular base guide"
        meta:
          - ["Bake temp", "385°F (195°C)"]
          - ["Bake time", "11 mins"]
          - ["Dough ball", "3 oz (~85g / #12 scoop)"]
          - ["Chill", "4 hrs minimum (overnight best)"]
        callout:
          label: "Modular prep strategy"
          text: "Scale and mix a single large batch of dry ingredients (flour, baking soda, baking powder, salt). Divide the dry mix equally into bowls, then assemble each variant's customized wet base and fold-ins."
        table:
          - title: "Master dry base scaling matrix"
            header: ["Ingredient", "1 batch (15 cookies)", "2 batches (30 cookies)", "3 batches (45 cookies, all 3 flavors)"]
            rows:
              - ["All-purpose flour", "2¾ cups + 2 tbsp (356g)", "5¾ cups (712g)", "8½ cups + 2 tbsp (1,068g)"]
              - ["Baking soda", "¾ tsp (3.75g)", "1½ tsp (7.5g)", "2¼ tsp (11.25g)"]
              - ["Baking powder", "¾ tsp (3g)", "1½ tsp (6g)", "2¼ tsp (9g)"]
              - ["Fine sea salt", "¼ tsp (2g)", "½ tsp (4g)", "¾ tsp (6g)"]
              - ["**Total dry mix**", "**~365g**", "**~730g**", "**~1,095g**"]
          - title: "Wet base & fold-ins by variant (per batch)"
            header: ["Ingredient", "A: Chocolate Chip", "B: Cranberry Orange", "C: Caramel"]
            rows:
              - ["Salted butter, browned & cooled", "254g (1 cup + 2 tbsp)", "254g (1 cup + 2 tbsp)", "184g (13 tbsp)"]
              - ["Light brown sugar, packed", "1 cup (240g)", "1 cup (240g)", "½ cup (120g)"]
              - ["Granulated sugar", "⅓ cup (70g)", "⅓ cup (70g)", "¼ cup (50g)"]
              - ["Large eggs, room temp", "2", "2", "2"]
              - ["Heavy cream, room temp", "3 tbsp (45ml)", "3 tbsp (45ml)", "— (in the caramel paste)"]
              - ["Vanilla", "2 tsp (8g) paste or extract", "2 tsp (8g) paste", "1 tbsp (15ml) extract"]
              - ["Flavoring", "—", "1 tbsp fresh orange zest", "Caramel paste: ½ cup (100g) sugar, 3 tbsp (42g) butter, ¼ cup (60ml) cream"]
              - ["Fold-ins", "1½ cups (250g) semi-sweet chips or dark chunks", "1 cup (200g) white chocolate chunks + ¾ cup (95g) dried cranberries, soaked in orange juice", "1 cup (170g) dark or semi-sweet chunks"]
              - ["Finish", "Flaky sea salt", "Flaky sea salt", "Extra chocolate + flaky sea salt"]
        steps:
          - heading: "Universal prep & baking protocol"
            items:
              - "**Mix master dry base:** Whisk scaled flour, baking soda, baking powder, and salt thoroughly in a large bowl. If making all 3 variants, divide the dry mix into 3 equal portions (~365g per bowl)."
              - "**Brown butter protocol:** Melt the specified salted butter over medium-high heat. Stir 5–8 mins as the milk solids turn deep golden amber and smell nutty. Pour into a bowl and cool 15–20 mins until warm, not hot."
              - "**Wet base emulsification:** Whisk cooled brown butter with the specified sugars for 1 full minute. Whisk in eggs one at a time, then the liquids and flavorings, until glossy and caramel-like."
              - "**Combine & chill:** Fold 1 dry base portion into the wet base just until combined. Fold in mix-ins. Scoop into 3 oz (~85g) balls. Cover tightly and chill at least 4 hours (overnight recommended)."
              - "**Bake at 385°F:** Preheat oven to 385°F (195°C). Space chilled balls 2–3 inches apart on parchment-lined sheets. Bake 10–12 mins (aim for 11). Pull when edges are set and golden but centers look slightly underdone. Top immediately with extra mix-ins and flaky salt. Cool 5 mins on the pan."
        notes:
          - label: "High-altitude chemistry"
            text: "All three recipes use the elevated flour mass (356g/batch) and reduced leaveners (¾ tsp soda and powder) to hold structure without collapsing or spreading thin at 5,000 ft. The 385°F oven sets the edges quickly, before faster evaporation at altitude causes spread, and fully chilled fat does the rest."

      - title: "A: Chocolate Chip"
        subtitle: "Variant A: Original brown butter chocolate chip • 15–16 cookies"
        credit: "Adapted from **Kiley Heard's** [brown butter chocolate chip cookies](https://www.wellmadebykiley.com/blog/brown-butter-chocolate-chip-cookies)"
        callout:
          label: "Dry base needed"
          text: "1 portion (~365g) from the master mix"
        ingredients:
          - heading: "Wet base & fold-ins"
            items:
              - "**254g (1 cup + 2 tbsp)** salted butter, browned & cooled (yields ~213g)"
              - "**1 cup (240g)** light brown sugar, packed"
              - "**⅓ cup (70g)** granulated sugar"
              - "**2 large eggs**, room temp"
              - "**3 tbsp (45ml)** heavy cream, room temp"
              - "**2 tsp (8g)** vanilla bean paste or extract"
              - "**1½ cups (250g)** semi-sweet chocolate chips or dark chunks"
              - "**Flaky sea salt** for finishing"
        steps:
          - items:
              - "Brown the butter over medium-high heat until dark amber and nutty (5–8 mins). Cool 15–20 mins."
              - "Whisk cooled brown butter, brown sugar, and granulated sugar for 1 minute until well combined."
              - "Add eggs one at a time, then whisk in heavy cream and vanilla paste until thick and glossy."
              - "Fold in 1 dry base portion (~365g) until just combined, then fold in chocolate."
              - "Scoop into 3 oz balls and chill at least 4 hours (overnight best). Bake at 385°F for 11 mins. Top with flaky salt and cool 5 mins on the pan."

      - title: "B: Cranberry Orange"
        subtitle: "Variant B: White chocolate cranberry orange • 15–16 cookies"
        credit: "My variation on the base recipe, developed with help from Gemini"
        callout:
          label: "Dry base needed"
          text: "1 portion (~365g) from the master mix"
        ingredients:
          - heading: "Wet base & fold-ins"
            items:
              - "**254g (1 cup + 2 tbsp)** salted butter, browned & cooled (yields ~213g)"
              - "**1 cup (240g)** light brown sugar, packed"
              - "**⅓ cup (70g)** granulated sugar"
              - "**2 large eggs**, room temp"
              - "**3 tbsp (45ml)** heavy cream, room temp"
              - "**2 tsp (8g)** vanilla paste + **1 tbsp** fresh orange zest"
              - "**1 cup (200g)** white chocolate chunks"
              - "**¾ cup (95g)** dried cranberries *(soaked & dried)*"
              - "**1–2 navel oranges**, juiced, for soaking"
              - "**Flaky sea salt** for finishing"
        steps:
          - items:
              - "Warm the orange juice 30 seconds in the microwave. Soak cranberries 15–20 mins, then strain and pat completely dry on paper towels."
              - "While the cranberries soak, brown the butter until golden amber (5–8 mins). Cool 15–20 mins."
              - "Whisk brown butter with both sugars. Add eggs, heavy cream, vanilla, and orange zest until emulsified."
              - "Fold in 1 dry base portion (~365g), then the white chocolate and dried cranberries."
              - "Portion into 3 oz balls, chill at least 4 hours (overnight best), and bake at 385°F for 11 mins. Top with flaky salt."

      - title: "C: Caramel"
        subtitle: "Variant C: Caramel-infused chocolate chip (direct caramel base) • 15–16 cookies"
        credit: "Inspired by **Alix Traeger's** [salted caramel cookies](https://alixtraeger.substack.com/p/salted-caramel-cookies)"
        callout:
          label: "Dry base needed"
          text: "1 portion (~365g) from the master mix"
        ingredients:
          - heading: "Homemade caramel paste"
            items:
              - "**½ cup (100g)** granulated sugar"
              - "**3 tbsp (42g)** salted butter"
              - "**¼ cup (60ml)** heavy cream"
          - heading: "Wet base & mix-ins"
            items:
              - "**184g (13 tbsp)** salted butter, browned & cooled (yields ~150g; reduced to offset caramel butter)"
              - "**½ cup (120g)** light brown sugar, packed"
              - "**¼ cup (50g)** granulated sugar"
              - "**2 large eggs**, room temp"
              - "**1 tbsp (15ml)** vanilla extract"
              - "**1 cup (170g)** dark or semi-sweet chocolate chunks"
              - "**Flaky sea salt** for finishing"
        steps:
          - items:
              - "**Make caramel paste:** Melt ½ cup sugar in a saucepan over medium heat until golden amber. Carefully stir in 3 tbsp butter until melted, then slowly pour in ¼ cup heavy cream while stirring. Pour into a glass bowl and cool completely (20+ mins) until it thickens into a soft paste."
              - "**Brown butter:** Brown 184g salted butter for 5–8 mins until golden amber and nutty. Cool 15–20 mins."
              - "**Emulsify wet base:** Whisk cooled brown butter, cooled caramel paste, brown sugar, and granulated sugar until cohesive and glossy. Whisk in eggs and vanilla until silky."
              - "**Combine & chill:** Fold in 1 dry base portion (~365g), then the chocolate chunks. Scoop into 3 oz balls and chill 8+ hours (overnight is mandatory for this variant)."
              - "**Bake:** Preheat oven to 385°F. Space balls 2–3 inches apart on parchment. Bake 11 mins. Top immediately with extra chocolate chunks and flaky sea salt. Cool 5 mins on the pan."
        notes:
          - label: "Critical caramel science note"
            text: "This variant adds liquid caramel to the wet base, so the dough fat is trimmed (184g butter instead of 254g) and the sugars are reduced. Chilling 8+ hours is required so the caramel's sugars and fats solidify fully, keeping the cookies thick at 385°F."

  # ---------------------------------------------------------------------------
  - id: smores-chocolate-pie
    category: pies
    title: "(No-Bake) S'mores Chocolate Pie"
    subtitle: "Graham-style crust • Silky chocolate pudding • Toasted meringue"
    blurb: "A honey cinnamon cookie crust, a rich dark and milk chocolate filling, and a torched marshmallowy meringue on top."
    tags: ["Chill 4+ hrs", "Kitchen torch"]
    credit: "Recipe from **A Bright Moment Co.** · [abrightmoment.com](https://abrightmoment.com/recipe_print/no-bake-smores-chocolate-pie)"
    source_url: "https://abrightmoment.com/recipe_print/no-bake-smores-chocolate-pie"
    parts:
      - meta:
          - ["Prep", "20 mins"]
          - ["Cook", "10 mins"]
          - ["Chill", "4 hrs to overnight"]
          - ["Pan", "8\" or 9\" pie dish"]
        callout:
          label: "\"No-bake\""
          text: "The filling is cooked on the stove and never goes in the oven. Only the crust gets a quick 10-minute bake."
        ingredients:
          - heading: "Crust"
            items:
              - "**8 oz** Simple Mills Honey Cinnamon Sweet Thins (about 2 boxes)"
              - "**6 tbsp** melted butter"
          - heading: "Chocolate filling"
            items:
              - "**½ cup** granulated sugar"
              - "**¼ cup** cornstarch"
              - "**¼ cup** unsweetened cocoa powder"
              - "**¼ tsp** fine sea salt"
              - "**2 cups** whole milk"
              - "**1 cup** heavy cream"
              - "**3 oz** dark chocolate, chopped"
              - "**3 oz** milk chocolate, chopped"
              - "**2 tbsp** unsalted butter, softened"
              - "**2 tsp** espresso powder *(optional)*"
              - "**2 tsp** vanilla extract"
          - heading: "Meringue"
            items:
              - "**4 large** egg whites, room temp"
              - "**1 cup** granulated sugar"
              - "**⅛ tsp** fine sea salt"
              - "**1 tsp** vanilla bean paste"
        steps:
          - heading: "Crust"
            items:
              - "Heat the oven to 350°F and butter an 8\" or 9\" pie dish."
              - "Pulse the Sweet Thins to fine crumbs in a food processor, then pulse in the melted butter. Press evenly over the bottom and up the sides of the dish."
              - "Bake on the middle rack 8–10 minutes, until golden. Cool at least 10 minutes."
          - heading: "Chocolate filling"
            items:
              - "In a heavy-bottomed saucepan, whisk the sugar, cornstarch, cocoa, and salt. Whisk in ½ cup of the milk until mostly smooth."
              - "Set over medium heat and gradually whisk in the rest of the milk and the cream. Keep whisking 8–10 minutes, until it thickens and small bubbles appear."
              - "Off the heat, stir in the butter, both chocolates, vanilla, and espresso powder (if using) until smooth."
              - "Pour into the crust and smooth the top. Cover and refrigerate at least 4 hours or overnight."
          - heading: "Meringue"
            items:
              - "Bring a few inches of water to a boil in a saucepan. In a bowl wider than the pan, combine the egg whites, sugar, and salt. Set it over the water and whisk constantly until the sugar fully dissolves and the mix looks like simple syrup."
              - "Move it straight to a stand mixer with the whisk and beat to stiff peaks, 8–10 minutes. Fold in the vanilla bean paste."
              - "Spoon over the chilled pie and toast with a kitchen torch. Garnish with orange zest and chocolate curls, if you like."

  # ---------------------------------------------------------------------------
  - id: upside-down-cookies-and-cream-cheesecake
    category: pies
    title: "Upside-Down Cookies and Cream Cheesecake"
    subtitle: "No-bake • Hot fudge center • Oreo crust on top • 14–16 servings"
    blurb: "A no-bake Oreo cheesecake with a hidden hot fudge center, flipped at the table so the crunchy crust ends up on top."
    tags: ["No-bake", "Make a day ahead", "Crowd"]
    credit: "Recipe by **Kiley Heard** · [Well Made by Kiley](https://www.wellmadebykiley.com/blog/upside-down-cookies-and-cream-cheesecake)"
    source_url: "https://www.wellmadebykiley.com/blog/upside-down-cookies-and-cream-cheesecake"
    parts:
      - meta:
          - ["Prep", "1 hr"]
          - ["Chill", "6 hrs to overnight"]
          - ["Pan", "9\" springform"]
          - ["Serves", "14–16"]
        callout:
          label: "Fudge must be cold"
          text: "Let the hot fudge cool completely (thick but still runny) before it goes into the cheesecake, or it will melt the filling."
        ingredients:
          - heading: "Hot fudge sauce (or store-bought)"
            items:
              - "**¼ cup (58g)** salted butter"
              - "**⅔ cup (135g)** semi-sweet chocolate chips"
              - "**1 cup (240ml)** half-and-half or heavy cream"
              - "**¾ cup (165g)** granulated sugar"
              - "**6 tbsp (36g)** unsweetened cocoa powder"
              - "**¼ tsp (1g)** salt"
              - "**2 tbsp (27g)** vanilla extract"
          - heading: "Oreo crust"
            items:
              - "**4 cups (580g)** crushed Oreos, with filling (or any chocolate sandwich cookie)"
              - "**¾ cup (170g)** salted butter, melted"
          - heading: "Cookies and cream filling"
            items:
              - "**1½ cups (360ml)** heavy cream, cold"
              - "**24 oz (3 blocks; 678g)** cream cheese, room temp"
              - "**¾ cup (90g)** powdered sugar"
              - "**½ cup (120g)** sour cream or Greek yogurt"
              - "**1 tsp (4g)** vanilla bean paste or extract"
              - "**Pinch** of salt"
              - "**18 Oreos** with filling, crushed (~205g)"
          - heading: "Whipped cream (optional, for serving)"
            items:
              - "**1½ cups (360ml)** heavy cream, cold"
              - "**⅓ cup (40g)** powdered sugar"
              - "**1 tsp (4g)** vanilla bean paste or extract"
        steps:
          - heading: "Hot fudge"
            items:
              - "Grease a 9\" springform pan and line the bottom with a parchment circle."
              - "In a saucepan over medium-low heat, melt the butter and chocolate chips, stirring often. Slowly whisk in the half-and-half, then the sugar, cocoa, and salt."
              - "Cook about 5 minutes, until it just reaches a gentle boil, then simmer on low 2–3 minutes, stirring, until slightly thickened. Off the heat, stir in the vanilla."
              - "Transfer to a bowl, cover tightly with plastic wrap so no skin forms, and chill until completely cool."
          - heading: "Crust"
            items:
              - "Stir the crushed Oreos and melted butter together until they look like wet sand."
              - "Press firmly and evenly over the bottom and all the way up the sides of the pan (the bottom of a measuring cup helps). Freeze 15–20 minutes."
          - heading: "Filling"
            items:
              - "Whip the cold cream to stiff peaks, about 5 minutes. Set aside."
              - "Beat the cream cheese until smooth. Beat in the powdered sugar for a minute, then the sour cream, vanilla, and salt for another minute."
              - "Gently fold in the whipped cream without deflating it, then fold in the crushed Oreos."
          - heading: "Assemble & chill"
            items:
              - "Spread about ⅔ of the filling over the crust, then push it out and up the sides to make a well in the center."
              - "Pour the cooled fudge into the well and spread to fill it."
              - "Cover with the rest of the filling, level with the rim of the pan. Cover and refrigerate at least 6 hours or overnight."
          - heading: "Serve"
            items:
              - "For the whipped cream, beat the cold cream on medium until frothy, then on high 3–4 minutes until thickening. Add the powdered sugar and vanilla and beat to stiff peaks."
              - "Set a round serving plate upside down on the pan, invert quickly, and release the springform. Smash into the crust and serve with whipped cream and crushed Oreos."

