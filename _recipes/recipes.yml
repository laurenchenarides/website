  # ---------------------------------------------------------------------------
  - id: sourdough-focaccia
    category: breads
    title: "Sourdough Focaccia"
    subtitle: "Extra jiggly, extra bubbly • One 9×13\" pan"
    blurb: "An 82% hydration sourdough focaccia with a wide-open, bubbly crumb. Start it in the morning; bake it for dinner."
    tags: ["Sourdough", "All day"]
    credit: "Adapted from **Kim** ([@cookim_mama](https://www.instagram.com/cookim_mama/))"
    source_url: "https://www.instagram.com/cookim_mama/"
    parts:
      - meta:
          - ["Oven", "400°F, then 450°F"]
          - ["Bake", "40–50 mins, in 3 stages"]
          - ["Pan", "9×13\", well oiled"]
          - ["Hydration", "82%"]
        callout:
          label: "Timing"
          text: "Start in the morning. Plan on roughly 1 hour of autolyse, 2–3 hours of folds, and 3–4 hours of proofing in the pan before baking. The proof may run longer or shorter depending on how warm your kitchen is."
        ingredients:
          - heading: "Dough (scales up or down)"
            items:
              - "**425g** bread flour"
              - "**25g** whole wheat flour"
              - "**370g** water (82% hydration), *20g reserved*"
              - "**98g** sourdough starter (25% levain)"
              - "**1g** instant yeast *(optional)*"
              - "**9g** salt (2%)"
              - "**9g** extra virgin olive oil (2%)"
          - heading: "For the pan & top"
            items:
              - "**Olive oil** for the pan, your hands, and drizzling"
              - "**Toppings** of your choice (I use brie)"
              - "**Honey or apricot glaze**, for finishing"
        steps:
          - items:
              - "**Autolyse:** In the morning, mix the bread flour and whole wheat flour with the water, reserving 20g of water for step 2. Cover and rest at least 1 hour, or until your starter is ready."
              - "**Mix:** Add the levain and combine. Add the salt, yeast, and remaining 20g of water. Once combined, add the olive oil. Slap and fold until the dough comes together. It will be very sticky but will come together over the next few steps. Return to the bowl, cover, and bulk ferment 30 mins."
              - "**Stretch & folds:** Perform 2–3 rounds of stretch and folds, each separated by 20–30 mins."
              - "**Coil folds:** Perform 2–3 rounds of coil folds, each separated by 20–30 mins. The dough should show signs of fermentation and be smoother now."
              - "**Pan & proof:** Transfer the dough to a well-oiled 9×13\" pan and gently stretch it to fill the pan. If it doesn't reach the corners, that's fine; it will spread as it proofs. Cover and ferment at least 3–4 hours in a warm spot."
              - "**Dimple:** Preheat oven to 400°F (205°C). Drizzle the dough with olive oil, grease your hands, and dimple."
              - "**First bake:** Bake at 400°F for 20 mins."
              - "**Top:** Remove from the oven and raise the temperature to 450°F (230°C). Add your toppings (I use brie). This step may vary depending on the topping and whether it's pre-cooked (e.g., veggies)."
              - "**Second bake:** Return to the 450°F oven for 10 mins."
              - "**Glaze & finish:** Remove the focaccia and turn the oven off. Brush or drizzle with honey or apricot glaze, then return it to the warm, cooling oven for 10–20 mins, checking often so it doesn't overbake."
        glossary:
          title: "Sourdough key: what means what"
          terms:
            - ["Sourdough starter", "The live culture of flour, water, wild yeast, and bacteria you keep and feed. It's \"ready\" when bubbly and about doubled, usually 4–12 hours after feeding."]
            - ["Levain", "The portion of active starter that goes into this dough. Here the 98g of ready starter *is* the levain; the terms are used interchangeably."]
            - ["Autolyse", "Resting flour and water together *before* adding starter, salt, or yeast. Hydrates the flour and starts gluten forming, so the dough is easier to work."]
            - ["Hydration & %", "Baker's percentages are relative to total flour weight (450g). 82% hydration means a very wet dough, which is what makes the crumb open and bubbly."]
            - ["Bulk ferment", "The first rise of the whole dough, during which the folds happen and the dough builds strength and flavor."]
            - ["Slap & fold", "Lifting the sticky dough, slapping it onto the counter, and folding it over itself. Builds strength quickly in a wet dough."]
            - ["Stretch & fold", "With wet hands, stretch one side of the dough up and fold it over. Turn the bowl and repeat on all four sides; that is one round."]
            - ["Coil fold", "Lift the dough from the middle so the ends tuck under, turn the bowl, and repeat. Gentler than stretch and folds, so it keeps the bubbles."]
            - ["Proof", "The final rise in the pan, where the dough puffs up and spreads before baking."]
            - ["Dimple", "Pressing oiled fingertips straight down into the dough to make the classic focaccia wells."]

  # ---------------------------------------------------------------------------
  - id: high-altitude-blueberry-muffins
    category: breads
    title: "High-Altitude Blueberry Muffins"
    subtitle: "Adapted for 5,000 ft elevation • Makes 12 muffins"
    blurb: "Tender, domed blueberry muffins with honey, buttermilk, and a crunchy turbinado top, calibrated for baking at altitude."
    tags: ["5,000 ft", "Quick"]
    credit: "Adapted for altitude from **Benjamin Delwiche**, *[Dessert Course](https://sites.prh.com/dessert-course)*"
    source_url: "https://sites.prh.com/dessert-course"
    parts:
      - meta:
          - ["Bake temp", "400°F (205°C)"]
          - ["Bake time", "~20 mins (check at 15)"]
          - ["Portion", "¼ cup (#16 scoop)"]
          - ["Yield", "12 muffins"]
        callout:
          label: "Don't overmix"
          text: "Fold the dry ingredients into the wet just until combined. A few small streaks of flour are fine. Overmixing develops gluten and gives you tough, tunneled muffins."
        ingredients:
          - heading: "Dry ingredients"
            items:
              - "**2 cups (280g)** all-purpose flour"
              - "**1¼ tsp** baking powder"
              - "**¼ tsp** baking soda"
              - "**½ tsp** table salt"
          - heading: "Wet ingredients"
            items:
              - "**140g (⅔ cup + 1 tbsp)** granulated sugar"
              - "**¼ cup (84g)** honey"
              - "**190g (¾ cup + 1 tbsp)** buttermilk"
              - "**½ cup (100g)** vegetable oil"
              - "**2 large eggs**"
              - "**1 tsp** vanilla extract"
          - heading: "Fold-in & topping"
            items:
              - "**1 cup (170g)** wild blueberries, fresh or frozen"
              - "**¼ cup (50g)** turbinado sugar, for topping"
        steps:
          - items:
              - "Preheat oven to 400°F. Line a 12-cup muffin pan with paper liners."
              - "In a medium bowl, whisk together the flour, baking powder, baking soda, and salt."
              - "In a separate large bowl, whisk the granulated sugar, honey, buttermilk, oil, eggs, and vanilla until well combined."
              - "Add the dry ingredients to the wet. Fold gently with a spatula **just until combined**. A few streaks of flour are fine; do not overmix."
              - "Gently fold in the blueberries. If using frozen, do not thaw them first."
              - "Divide the batter evenly among the 12 cups, about ¼ cup each (#16 scoop)."
              - "Sprinkle the tops with turbinado sugar."
              - "Bake at 400°F for about 20 minutes, checking at 15. Muffins are done when the tops are golden and a toothpick in the center comes out clean or with a few moist crumbs."
              - "Cool in the pan for about 5 minutes, then transfer to a wire rack."

