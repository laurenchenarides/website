  - id: rolled-florettes
    category: baking
    tested: false
    title: "Rolled Florettes"
    subtitle: "Rolled jelly-nut cookies • Makes about 24"
    blurb: "A tender yeasted dough rolled around jam, nuts, and nutmeg, then sliced and baked."
    tags: ["Cookies", "1971"]
    credit: "**L. Tsontarides**, September 1971, in Yiayia's recipe collection"
    parts:
      - meta:
          - ["Oven", "350°F (175°C)"]
          - ["Bake", "12–15 mins"]
          - ["Roll", "¼ inch thick"]
          - ["Makes", "About 24"]
        ingredients:
          - heading: "Dough"
            items:
              - "**1 cup** butter, softened"
              - "**½ cup** light cream, room temp"
              - "**½ tsp** yeast, dissolved in the cream"
              - "**1** egg yolk"
              - "**1 tsp** baking powder"
              - "**Flour**, as needed for a soft, rollable dough"
          - heading: "Filling"
            items:
              - "**1 cup** jam or preserves (any flavor)"
              - "**½ cup** chopped nuts"
              - "**¼ tsp** nutmeg"
