  # ---------------------------------------------------------------------------
  - id: eros-kourabiedes
    category: greek
    tested: false
    title: "Ero's Kourabiedes"
    subtitle: "Greek butter cookies • Makes about 40"
    blurb: "Tender butter cookies with a splash of whiskey, cognac, or ouzo, buried in powdered sugar."
    tags: ["Holidays", "Cookies"]
    credit: "From **Ero**, in Yiayia's recipe collection"
    parts:
      - meta:
          - ["Oven", "350°F (175°C)"]
          - ["Prep", "15 mins"]
          - ["Bake", "15–20 mins per batch"]
          - ["Makes", "About 40 cookies"]
        ingredients:
          - items:
              - "**1 lb (4 sticks)** sweet (unsalted) butter, softened"
              - "**1 demitasse cup** confectioners' sugar (about ½ cup)"
              - "**1** egg yolk, beaten"
              - "**1 jigger** whiskey, cognac, or ouzo (about 1½ oz)"
              - "**5 cups** all-purpose flour (Pillsbury recommended)"
              - "**Confectioners' sugar**, for finishing"
              - "**Rose water**, for brushing *(optional)*"
        steps:
          - items:
              - "Preheat the oven to 350°F (175°C). Line baking sheets with parchment paper."
          - heading: "Dough"
            items:
              - "Beat the butter until creamy and light, like whipped cream."
              - "Gradually beat in the confectioners' sugar, then the egg yolk, until smooth and fluffy."
              - "Stir in the whiskey, cognac, or ouzo."
              - "Gradually add the flour until the dough is soft but not sticky. You may need a little more or less depending on humidity and your flour."
          - heading: "Shape & bake"
            items:
              - "Shape walnut-size pieces into crescents or balls and set them about 1 inch apart on the sheets."
              - "Bake 15–20 minutes, until just starting to turn golden around the edges."
          - heading: "Finish"
            items:
              - "While still warm, lightly brush with rose water (if using) and sift confectioners' sugar generously over the top."
              - "Cool a few minutes on the sheets, then move to a rack to cool completely. Sift on more sugar before serving."
        notes:
          - label: "Serving"
            text: "Perfect for holidays and special occasions, and as gifts. Serve on a dessert platter with coffee or tea."

  # ---------------------------------------------------------------------------
  - id: galaktoboureko
    category: greek
    tested: false
    title: "Galaktoboureko"
    subtitle: "Custard in phyllo with light syrup • Serves 8–10"
    blurb: "A creamy cream-of-rice custard baked in buttery phyllo until golden and soaked with a light lemon syrup."
    tags: ["Custard", "Phyllo", "Make-ahead"]
    credit: "From Yiayia's recipe collection"
    parts:
      - meta:
          - ["Oven", "350°F (175°C)"]
          - ["Prep", "30 mins"]
          - ["Bake", "45–55 mins"]
          - ["Serves", "8–10"]
        callout:
          label: "Best guess"
          text: "Yiayia's notes call this a phyllo pastry but leave the phyllo out. I've added it the traditional way, with sheets under and over the custard. Her custard uses cream of rice where many recipes use semolina, and it works the same way. If she topped it with shredded phyllo (kataifi) instead, see the note at the end."
        ingredients:
          - heading: "Custard"
            items:
              - "**¼ cup (½ stick)** butter"
              - "**3 cups** milk"
              - "**¾ cup** sugar"
              - "**1 cup** cream of rice (or fine semolina)"
              - "**1 tsp** vanilla extract"
              - "**4 large eggs** (or 5 if small), beaten"
          - heading: "Phyllo (best guess)"
            items:
              - "**1 lb (16 oz)** phyllo sheets, thawed"
              - "**¾–1 cup (1½–2 sticks)** butter, melted, for brushing"
          - heading: "Light syrup"
            items:
              - "**1 cup** water"
              - "**½ cup** sugar"
              - "**½ tsp** lemon juice"
        steps:
          - heading: "Custard"
            items:
              - "In a large saucepan, heat the milk, butter, and sugar over medium heat until nearly boiling."
              - "Slowly whisk in the cream of rice and keep whisking until thick and smooth."
              - "Remove from the heat and cool to lukewarm, stirring now and then so a skin doesn't form."
              - "Gradually whisk in the beaten eggs until smooth and creamy, then stir in the vanilla."
          - heading: "Syrup"
            items:
              - "In a small saucepan, bring the water, sugar, and lemon juice to a boil. Simmer until slightly thickened, about 10 minutes. Cool completely."
          - heading: "Bake & finish"
            items:
              - "Preheat the oven to 350°F (175°C). Butter a 9×13-inch baking dish."
              - "Layer about half the phyllo sheets in the dish, brushing each with melted butter and letting the edges hang over the sides. Keep the rest covered with a damp towel so it doesn't dry out."
              - "Pour in the custard and smooth the top. Fold the overhanging phyllo over it."
              - "Layer the remaining sheets on top, brushing each with butter. Tuck in the edges, then score the top layers into squares with a sharp knife, without cutting down to the custard."
              - "Bake 45–55 minutes, until the phyllo is deep golden and the custard is set."
              - "Let it cool slightly, then pour the cooled syrup evenly over the top so it soaks in."
              - "Cool completely before cutting along the scored lines."
        notes:
          - label: "Serving"
            text: "Serve chilled or at room temperature. It pairs beautifully with a cup of Greek coffee."
          - label: "Shredded phyllo top"
            text: "If Yiayia meant phyllo shreds on top, use 8 oz kataifi instead of the top sheets. Pull it apart, toss it with ½ cup melted butter, and spread it over the custard before baking."

  # ---------------------------------------------------------------------------
  - id: vasilopita
    category: greek
    tested: false
    title: "Vasilopita"
    subtitle: "Greek New Year bread with a hidden coin"
    blurb: "A sweet, mastic- and mahlepi-scented New Year's bread. Whoever finds the coin has good luck all year."
    tags: ["New Year's", "Yeasted"]
    credit: "From Yiayia's recipe collection"
    parts:
      - meta:
          - ["Oven", "325°F (165°C)"]
          - ["Rise", "2 × 1 hr"]
          - ["Bake", "35–45 mins, to 190°F"]
          - ["For", "New Year's Day"]
        callout:
          label: "Doneness"
          text: "The family notes say about 20 minutes, but a loaf made with 4 cups of flour usually needs 35–45 minutes at 325°F. Go by temperature, not time: it's done when the center reads 190°F on an instant-read thermometer (about 185°F at high altitude, where water boils at a lower temperature). If the top browns before the inside is done, tent it loosely with foil. The notes sweeten it with Equal packets plus powdered sugar."
        ingredients:
          - heading: "Bread"
            items:
              - "**½ cup** water (for steeping the spices)"
              - "**¼ tsp** mastic (mastiha), ground"
              - "**¼ tsp** mahlepi (mahlab), ground"
              - "**¼ lb (1 stick)** salted butter, melted"
              - "**⅓ cup** sweetened condensed milk, warmed"
              - "**3 eggs**, warmed"
              - "**4 cups** flour"
              - "**½ cup** confectioners' (powdered) sugar"
              - "**4 packets** Equal sweetener"
              - "**2 packages** instant yeast"
              - "**1 dime** (or other coin), wrapped in aluminum foil"
          - heading: "Glaze"
            items:
              - "**1** egg yolk"
              - "**1 tbsp** water"
              - "**Sesame seeds**, for sprinkling"
        steps:
          - heading: "Spiced liquid"
            items:
              - "Bring the ½ cup water to a boil in a small pot, add the mastic and mahlepi, and remove from the heat."
              - "Add the melted butter and condensed milk. Cool to room temperature, then whisk in the warm eggs."
          - heading: "Dough"
            items:
              - "Sift the flour into a large bowl and mix in the powdered sugar, Equal, and yeast."
              - "Make a well in the center, pour in the liquid, and knead until the dough is soft and not sticky. (Buttered, gloved hands help.)"
              - "Cover with a towel and let rise at room temperature for 1 hour."
          - heading: "Shape & bake"
            items:
              - "Knead briefly, shape as you like, and press the foil-wrapped coin into the dough."
              - "Mix the egg yolk and water, brush it over the top, and sprinkle with sesame seeds."
              - "Let rise another hour at room temperature."
              - "Bake at 325°F (165°C) until deep golden and the center reads 190°F, about 35–45 minutes. Start checking at 20 minutes (see the note above)."
              - "Cool before slicing. Whoever finds the coin has good luck for the year!"
        notes:
          - label: "Using a KitchenAid"
            text: "Mix the dry ingredients with the flat beater. Switch to the dough hook and add the liquid on low (speed 2), then knead on medium (speed 4–6) for 8–10 minutes until soft, smooth, elastic, and clear of the bowl. Let it rise in a greased, covered bowl until doubled, about 1 hour. Shape, set on a parchment-lined sheet, cover, and rise another hour."

  # ---------------------------------------------------------------------------
  - id: vivians-pumpkin-pie
    category: baking
    tested: false
    title: "Vivian's Pumpkin Pie"
    subtitle: "Two pies, with a touch of molasses • 8–10 servings each"
    blurb: "A big-batch pumpkin pie warmed with ginger, cinnamon, and molasses. Makes two."
    tags: ["Thanksgiving", "Makes 2"]
    credit: "From **Vivian**, in Yiayia's recipe collection"
    parts:
      - meta:
          - ["Oven", "425°F, then 350°F"]
          - ["Bake", "About 60 mins"]
          - ["Makes", "2 pies"]
          - ["Crust", "2 unbaked shells"]
        ingredients:
          - items:
              - "**4 eggs**, slightly beaten"
              - "**1 can (29 oz)** pumpkin purée (not pie filling)"
              - "**1½ cups** granulated sugar"
              - "**¾ tsp** salt"
              - "**½ tsp** ground cinnamon, plus extra for sprinkling"
              - "**1 tsp** pumpkin pie spice"
              - "**1 tsp** ground ginger"
              - "**2 cans (13 oz each)** evaporated milk, or 3½ cups half-and-half"
              - "**⅓ cup** molasses"
              - "**2** unbaked pie shells (try the Pie Crust under Basics)"
        steps:
          - items:
              - "Preheat the oven to 425°F (220°C)."
              - "In a large bowl, mix the eggs, pumpkin, sugar, salt, cinnamon, pumpkin pie spice, and ginger."
              - "Gradually stir in the evaporated milk or half-and-half, then the molasses, until fully combined."
              - "Divide the filling between the two pie shells."
              - "Bake 15 minutes at 425°F, then lower the oven to 350°F (175°C) and bake about 45 minutes more. Halfway through, sprinkle the tops with cinnamon."
              - "The pies are done when a knife inserted near the center comes out clean. Cool on a wire rack."
        notes:
          - label: "Swap"
            text: "Cooked, mashed butternut squash can stand in for the pumpkin."
          - label: "Serving"
            text: "Serve at room temperature or chilled, with whipped cream or vanilla ice cream."

