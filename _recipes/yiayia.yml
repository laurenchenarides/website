              - "Mix in the baking powder and enough flour to make a soft, rollable dough."
              - "In another bowl, mix the jam, nuts, nutmeg, and Zwieback crumbs."
          - heading: "Roll, slice & bake"
            items:
              - "Preheat the oven to 350°F (175°C) and butter a baking sheet."
              - "On a floured surface, roll the dough about ¼ inch thick and spread the filling evenly over it."
              - "Roll it up into a log and cut diagonally into slices about 1 inch thick."
              - "Bake 12–15 minutes, until lightly golden. Cool a few minutes on the sheet, then on a rack."
              - "Dust with confectioners' sugar once cool."

