              - "**1** small jalapeño, seeded and finely chopped"
              - "**1** small red onion, finely chopped"
              - "**¼ cup** chopped fresh cilantro"
              - "**Juice of 1** lime"
          - heading: "Salad"
            items:
              - "**1 cup** diced melon (any kind)"
              - "**1** English cucumber, diced, skin on"
              - "**¼ cup** chopped red onion"
              - "**½ cup** sliced radishes"
          - heading: "Dressing"
            items:
              - "**2 tbsp** mint jelly"
              - "**3 tbsp** olive oil"
              - "**Juice of 1** lime"
        steps:
          - heading: "Hash"
            items:
              - "In a large skillet over medium heat, cook the sausage, breaking it up, until cooked through and slightly crispy."
              - "Add the sweet potatoes and red onion and cook, stirring now and then, until the potatoes are tender and lightly browned."
              - "Stir in the chili powder, smoked cumin, and coriander and cook 2 minutes more."
              - "Off the heat, sprinkle the Manchego over the hot hash and let it melt."
          - heading: "Sauce"
            items:
              - "Blanch the tomatoes to slip off the skins, remove the seeds, and dice."
              - "Mix the tomatoes with the jalapeño, red onion, cilantro, and lime juice. Set aside to let the flavors meld."
          - heading: "Salad & dressing"
            items:
              - "Combine the melon, cucumber, red onion, and radishes."
              - "Whisk the mint jelly, olive oil, and lime juice, then toss with the salad."
          - heading: "Serve"
            items:
              - "Divide the hash among plates, top with a spoonful of the sauce, and serve the salad on the side."

