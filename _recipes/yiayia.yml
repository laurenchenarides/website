          - ["Cook", "10 mins"]
          - ["Reduce", "By about half"]
          - ["Serve", "Over fresh fruit"]
        ingredients:
          - items:
              - "**¾ cup** balsamic vinegar"
              - "**1 heaping tbsp** crème fraîche"
              - "**1 tsp** sugar"
        steps:
          - items:
              - "In a small saucepan over medium heat, whisk the vinegar, crème fraîche, and sugar together."
              - "Bring to a boil, stirring so the sugar dissolves."
              - "Lower the heat and simmer, stirring occasionally, until reduced by about half, 5–10 minutes."
              - "Cool slightly and drizzle sparingly over fresh fruit; the flavor is rich."
        notes:
          - label: "Serving"
            text: "Lovely with strawberries, blueberries, or sliced pears, on a dessert plate or in a fruit salad."

