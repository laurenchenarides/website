  - id: couscous-salad
    category: savory
    tested: false
    title: "Couscous Salad"
    subtitle: "Artichokes, chickpeas, mint & chicken • Serves 6–8"
    blurb: "A make-ahead couscous salad with artichokes, chickpeas, tomatoes, cucumber, mint, and chicken."
    tags: ["Picnic", "Make-ahead"]
    credit: "From Yiayia's recipe collection"
    parts:
      - meta:
          - ["Prep", "About 20 mins"]
          - ["Chill", "30 mins+"]
          - ["Serves", "6–8"]
          - ["Serve", "Cold"]
        ingredients:
          - items:
              - "**1 cup** couscous"
              - "**1 cup** vegetable broth"
              - "**1 can (about 14 oz)** artichoke hearts, drained and chopped"
              - "**1 bunch** scallions, chopped"
              - "**¼ cup** fresh mint, chopped"
              - "**1 large carton (about 15 oz)** chickpeas, drained and rinsed"
              - "**1 cup** cherry tomatoes, halved"
              - "**½** English cucumber, chopped"
              - "**1** cooked chicken breast, chopped"
