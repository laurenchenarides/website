              - "Gently mix in the chicken. Drizzle with the olive oil and lemon juice, sprinkle with cayenne, and mix well."
              - "Chill at least 30 minutes. Stir again before serving and adjust the lemon or cayenne to taste."
        notes:
          - label: "Vegetarian"
            text: "The notes filed this under vegetarian dishes, but it includes chicken. Leave the chicken out for a vegetarian version."

