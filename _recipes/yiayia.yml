  - id: roseanns-cheesecake
    category: baking
    tested: false
    title: "RoseAnn's Cheese Cake"
    subtitle: "Ricotta and cream cheese • Optional berry glaze • Serves 8–10"
    blurb: "A tall ricotta and cream cheese cheesecake that finishes setting in a closed oven, with an optional cherry or blueberry glaze."
    tags: ["Springform", "Make-ahead"]
    credit: "From **RoseAnn**, in Yiayia's recipe collection"
    parts:
      - meta:
          - ["Oven", "325°F (163°C)"]
          - ["Bake", "1 hr + 2 hrs in the closed oven"]
          - ["Pan", "Springform, greased"]
          - ["Serves", "8–10"]
        ingredients:
          - heading: "Cheesecake"
            items:
              - "**1 lb** whole-milk ricotta"
              - "**1 lb** cream cheese"
              - "**1½ cups** granulated sugar"
              - "**4 large eggs**"
              - "**3 drops** lemon juice"
              - "**1 tsp** vanilla extract"
              - "**5 tbsp** cornstarch"
              - "**3 tbsp** all-purpose flour"
              - "**¼ lb (1 stick)** butter, melted over hot water"
              - "**1 pint (16 oz)** sour cream"
          - heading: "Glaze (optional)"
            items:
              - "**½ cup** liquid (juice from the berries, topped up with water)"
              - "**¼ cup** granulated sugar"
              - "**1 tsp** lemon juice"
              - "**1 tbsp** cornstarch"
              - "**Cherries or blueberries**, for topping"
        steps:
          - heading: "Cheesecake"
            items:
              - "Preheat the oven to 325°F (163°C) and grease a springform pan."
              - "Beat the ricotta and cream cheese until smooth. Gradually add the sugar."
              - "Add the eggs one at a time, beating well after each, then the lemon juice and vanilla."
              - "Whisk the cornstarch and flour together and mix them in."
              - "Mix in the melted butter and sour cream until combined, then pour into the pan."
              - "Bake 1 hour, then turn the oven off and leave the cheesecake in the closed oven for 2 more hours without opening the door."
              - "Remove, cool completely, and refrigerate until serving."
          - heading: "Glaze (optional)"
            items:
              - "In a saucepan over medium heat, cook the liquid, sugar, lemon juice, and cornstarch, stirring constantly, until thickened. Cool slightly."
              - "Fold in the berries (or just top the cheesecake with them) and spread over the chilled cheesecake before serving."

