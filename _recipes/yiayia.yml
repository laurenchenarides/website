  - id: skordalia
    category: sauces
    tested: false
    title: "Skordalia"
    subtitle: "Greek garlic sauce, two ways"
    blurb: "A punchy garlic, bread, and olive oil sauce for vegetables, fish, and bread. Two versions from the notes."
    tags: ["Greek", "Dip", "2 versions"]
    credit: "From Yiayia's recipe collection"
    parts:
      - title: "Blender"
        subtitle: "Quick blender version • About 1 cup"
        meta:
          - ["Prep", "15 mins"]
          - ["Chill", "1 hr for best flavor"]
          - ["Makes", "About 1 cup"]
          - ["Tool", "Food processor or blender"]
        ingredients:
          - items:
              - "**1** medium clove garlic"
              - "**¼ cup** vinegar (white or red wine vinegar preferred)"
              - "**½ cup** olive oil"
              - "**8 slices** white bread, crusts removed"
              - "**Water**, for soaking the bread"
        steps:
          - items:
              - "Soak the bread in water just until moistened, then squeeze out the excess thoroughly. It should be damp, not wet."
              - "In a food processor or blender, pulse the bread, garlic, and vinegar into a smooth paste."
              - "With the machine running, drizzle in the olive oil very slowly so it emulsifies and turns creamy."
              - "Thin with a little water or vinegar if needed, and adjust the garlic and vinegar to taste."
              - "Chill at least an hour to let the flavors meld. Serve chilled or at room temperature."
        notes:
          - label: "Serving"
            text: "Serve as a dip with vegetables or fish, as a spread for bread, or on a meze platter alongside fried zucchini and eggplant."
      - title: "Mortar & Pestle"
        subtitle: "Whole-head garlic version • About 1–1½ cups"
        meta:
          - ["Prep", "20 mins"]
          - ["Makes", "About 1–1½ cups"]
          - ["Bread", "1–2 days old"]
          - ["Tool", "Mortar & pestle, mixer"]
        ingredients:
          - items:
              - "**1 whole head** garlic, cloves peeled"
              - "**1 tsp** salt"
              - "**¼ cup** white wine or cider vinegar"
              - "**1 large loaf** dried bread (a day or two old)"
              - "**About 1 cup** olive oil"
        steps:
          - items:
              - "Mash the garlic with the salt in a mortar and pestle until smooth and pasty. (No mortar? Use the flat of a knife or a small food processor.)"
              - "Cut off the bread crusts. Soak the soft center just until moistened, then squeeze out all the excess water."
              - "Put the bread in a large bowl with the garlic paste and vinegar."
              - "Beat with an electric mixer or a strong whisk while drizzling in the olive oil very slowly, until thick and creamy like a thick mayonnaise."
              - "Adjust the salt and vinegar to taste, and loosen with a little vinegar or water if it's too thick."
        notes:
          - label: "Serving"
            text: "Serve with vegetables, grilled meats, or warm bread, or as part of a Greek meze platter."

