  - id: apricot-jello-mold
    category: baking
    tested: false
    title: "Apricot Jello Mold"
    subtitle: "Layered apricot gelatin with sour cream • Serves 6–8"
    blurb: "A retro layered apricot gelatin mold with a sour cream center. Make it a day ahead."
    tags: ["No-bake", "Make-ahead"]
    credit: "From Yiayia's recipe collection"
    parts:
      - meta:
          - ["Chill", "Until fully set (best overnight)"]
          - ["Mold", "Greased (or nonstick Tupperware)"]
          - ["Serves", "6–8"]
          - ["Make", "A day ahead"]
        ingredients:
          - items:
              - "**2 small boxes** apricot gelatin"
              - "**2 cans (12 oz each)** apricot nectar"
              - "**1 can (5.5 oz)** evaporated milk"
              - "**½ pint** sour cream"
              - "**1 cup** warm water"
        steps:
          - heading: "First layer"
            items:
              - "In a saucepan, dissolve one box of gelatin in the 1 cup warm water. Remove from the heat and stir in 1 cup apricot nectar."
              - "Pour into a greased mold and refrigerate until fully set."
          - heading: "Sour cream layer"
            items:
              - "Spread the sour cream evenly over the set gelatin and return it to the fridge."
          - heading: "Second layer"
            items:
              - "Dissolve the second box of gelatin in 1 cup apricot nectar (no heat). Let it come to room temperature, then stir in the evaporated milk."
              - "Pour gently over the sour cream layer and refrigerate until the whole mold is firm."

  # ---------------------------------------------------------------------------
  - id: stuffed-zucchini
    category: savory
    tested: false
    title: "Stuffed Zucchini"
    subtitle: "Vegetable, quinoa & Parmesan filling • Serves 5"
    blurb: "Zucchini boats filled with sautéed vegetables, quinoa, and Parmesan, then baked until tender."
    tags: ["Vegetarian", "Main or side"]
    credit: "From Yiayia's recipe collection"
    parts:
      - meta:
          - ["Oven", "375°F (190°C)"]
          - ["Prep", "20 mins"]
          - ["Bake", "30 mins"]
          - ["Serves", "5 (1 zucchini each)"]
        ingredients:
          - items:
              - "**5** medium zucchini"
              - "**3 tbsp** olive oil"
              - "**3 cloves** garlic, minced"
              - "**1** large onion, finely chopped"
              - "**1** red bell pepper, finely chopped"
              - "**½ cup** chopped celery"
              - "**½ cup** chopped mushrooms"
              - "**½ cup** cooked quinoa"
              - "**Zucchini pulp**, chopped (saved from scooping)"
              - "**¼ cup** grated Parmesan"
              - "**Salt and pepper**, to taste"
        steps:
          - items:
              - "Preheat the oven to 375°F (190°C)."
              - "Halve the zucchini lengthwise and scoop out the pulp, leaving a ¼-inch shell. Chop the pulp and set it aside."
              - "Heat the oil in a large skillet over medium heat. Sauté the garlic, onion, and red pepper until the onion is translucent, about 5 minutes."
              - "Add the celery and mushrooms and cook until tender, about 5 minutes more."
              - "Stir in the zucchini pulp and quinoa and cook 2–3 minutes. Season with salt and pepper."
              - "Remove from the heat, cool slightly, and stir in the Parmesan."
              - "Arrange the shells on a baking sheet and spoon in the filling, packing lightly."
              - "Bake 30 minutes, until the shells are tender and the tops lightly browned. Serve warm, with extra Parmesan or a drizzle of olive oil."

