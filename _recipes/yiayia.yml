  # ---------------------------------------------------------------------------
  - id: jelly-cookies
    category: baking
    tested: false
    title: "Jelly Cookies (Cut-Outs)"
    subtitle: "Sandwich cookies with jelly • Makes about 24"
    blurb: "Buttery cut-out sandwich cookies filled with your favorite jelly and dusted with powdered sugar."
    tags: ["Cookies", "Holidays"]
    credit: "From Yiayia's recipe collection"
    parts:
      - meta:
          - ["Oven", "350°F (175°C)"]
          - ["Bake", "8–10 mins"]
          - ["Roll", "¼ inch thick"]
          - ["Makes", "About 24"]
        callout:
          label: "Best guess"
          text: "The notes don't list any flour. This dough (butter, cream, and no sugar) matches a classic cream wafer, which uses about 2 cups of flour per cup of butter. With the extra cream here, start with 2 cups and add up to ¼ cup more until the dough rolls without sticking. Note the amount you use."
        ingredients:
          - items:
              - "**1 cup** butter, softened"
              - "**½ cup** light cream"
              - "**1** egg yolk"
              - "**1 tsp** baking powder"
              - "**2–2¼ cups** all-purpose flour (best guess; see above)"
              - "**Powdered sugar**, for dusting"
              - "**About ½ cup** jelly (any flavor), for filling"
        steps:
          - heading: "Dough"
            items:
              - "Preheat the oven to 350°F (175°C). Line a baking sheet with parchment (or use a nonstick pan)."
              - "Cream the butter and light cream until smooth. Mix in the egg yolk, then the baking powder."
              - "Mix in 2 cups of flour. If the dough is still sticky, add more a tablespoon at a time. If it's soft, chill it for 30 minutes before rolling."
          - heading: "Cut & bake"
            items:
              - "On a lightly floured surface, roll the dough about ¼ inch thick and cut shapes. Cut an even number: each cookie needs a top and a bottom."
              - "Bake 8–10 minutes, until the edges just start to brown. Cool a few minutes on the sheet, then on a rack."
          - heading: "Assemble"
            items:
              - "Dust half the cookies (the tops) with powdered sugar. Spread a little jelly in the center of the rest (the bottoms)."
              - "Press the tops onto the bottoms. Let the jelly set slightly before serving, or store airtight."

