  - id: pie-crust
    category: basics
    tested: false
    title: "Pie Crust"
    subtitle: "Shortening crust • 1 double or 2 single crusts"
    blurb: "A simple, flaky shortening crust for sweet or savory pies, from apple to chicken pot pie."
    tags: ["Basics", "Sweet or savory"]
    credit: "From **Mrs. Myer's mother** (Tilson, NY), in Yiayia's recipe collection"
    parts:
      - meta:
          - ["Makes", "1 double or 2 single"]
          - ["Chill", "30 mins+"]
          - ["Fat", "Crisco (shortening)"]
          - ["Bake", "Per your pie recipe"]
        ingredients:
          - items:
              - "**2 cups** all-purpose flour"
              - "**1 tsp** salt"
              - "**¾ cup** Crisco (vegetable shortening)"
              - "**4–6 tbsp** ice water"
        steps:
          - items:
              - "In a large bowl, mix the flour and salt."
              - "Cut in the Crisco with a pastry cutter or two forks until it looks like coarse crumbs with some pea-size pieces."
              - "Sprinkle 4 tablespoons ice water over it and mix gently with a fork, adding more a tablespoon at a time just until the dough starts to come together."
              - "Turn it out onto a lightly floured surface and knead a few times into a ball. Divide in half for two single crusts."
              - "Flatten into discs, wrap, and chill at least 30 minutes."
              - "To use, let a well-chilled disc sit about 10 minutes, roll it out on a floured surface to fit your dish, and bake as your pie recipe directs."
