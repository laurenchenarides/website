    title: "7-Up Cake"
    subtitle: "Cake mix + pudding + 7-Up • Bundt or tube pan • Serves 8–10"
    blurb: "A moist, nutty lemon or yellow bundt cake that starts from a box. A family-gathering classic."
    tags: ["Easy", "Bundt"]
    credit: "From Yiayia's recipe collection"
    parts:
      - meta:
          - ["Oven", "350°F (175°C)"]
          - ["Bake", "About 45 mins"]
          - ["Pan", "Tube or bundt, greased"]
          - ["Serves", "8–10"]
        ingredients:
          - items:
              - "**1 box** lemon or yellow cake mix (preferably Duncan Hines)"
              - "**1 box** instant pudding mix (lemon or vanilla)"
              - "**½ cup** vegetable oil"
              - "**1 cup** 7-Up or ginger ale"
              - "**1 tsp** vanilla extract"
              - "**4 large eggs**"
              - "**1 cup** chopped nuts (walnuts recommended)"
        steps:
          - items:
              - "Preheat the oven to 350°F (175°C) and grease a tube or bundt pan."
